name: CI

on:
  push:
    branches: [main]
    tags-ignore: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0.2'

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: PortNanny/.build
          key: spm-${{ runner.os }}-${{ hashFiles('PortNanny/Package.swift', 'PortNanny/Package.resolved') }}-6.0.2
          restore-keys: spm-${{ runner.os }}-

      - name: build.sh and CHANGELOG must agree on the version
        run: bash PortNanny/scripts/check-version.sh

      - name: Build app
        run: |
          cd PortNanny
          chmod +x scripts/build.sh
          ./scripts/build.sh
          test -d dist/PortNanny.app

      - name: Run tests
        run: |
          cd PortNanny
          # The scenario tests spawn the debug `portnanny` binary, which is
          # not a dependency of the test target; build every product first.
          swift build
          swift test --disable-sandbox

      - name: UI render smoke test
        run: |
          cd PortNanny
          swift build
          PORTNANNY_SNAPSHOT=/tmp/ui-smoke.png .build/debug/PortNanny
          test -s /tmp/ui-smoke.png
          PORTNANNY_SNAPSHOT=/tmp/ui-workbench.png PORTNANNY_SNAPSHOT_VIEW=workbench .build/debug/PortNanny
          test -s /tmp/ui-workbench.png
          PORTNANNY_SNAPSHOT=/tmp/ui-palette.png PORTNANNY_SNAPSHOT_SEARCH="kill 3000" .build/debug/PortNanny
          test -s /tmp/ui-palette.png

      - name: Upload UI snapshot
        uses: actions/upload-artifact@v7
        with:
          name: ui-smoke
          path: /tmp/ui-*.png

  # The release ships an x86_64 slice; run the suite through Rosetta so it
  # has executed at least once. Advisory until an Intel runner is available.
  tests-x86_64:
    runs-on: macos-14
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0.2'

      - name: Run tests under Rosetta
        run: |
          cd PortNanny
          arch -x86_64 swift test --disable-sandbox --arch x86_64

