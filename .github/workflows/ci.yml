name: CI

on:
  push:
    branches: [main]
    tags-ignore: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0.2'

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build app
        run: |
          cd PortKilla
          chmod +x scripts/build.sh
          ./scripts/build.sh
          test -d dist/PortKilla.app

      - name: Run tests
        run: |
          cd PortKilla
          swift test --disable-sandbox

      - name: UI render smoke test
        run: |
          cd PortKilla
          swift build
          PORTKILLA_SNAPSHOT=/tmp/ui-smoke.png .build/debug/PortKilla
          test -s /tmp/ui-smoke.png

      - name: Upload UI snapshot
        uses: actions/upload-artifact@v7
        with:
          name: ui-smoke
          path: /tmp/ui-smoke.png

