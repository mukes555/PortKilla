name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0.2'

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Tag, build.sh, and CHANGELOG must agree on the version
        run: bash PortKilla/scripts/check-version.sh "$GITHUB_REF_NAME"

      - name: Build and Package
        run: |
          cd PortKilla
          chmod +x scripts/build.sh
          ./scripts/build.sh --dmg
          ditto -c -k --sequesterRsrc --keepParent dist/PortKilla.app dist/PortKilla.app.zip
          ls -la dist

      - name: Verify what is about to ship
        run: |
          cd PortKilla
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHS="$(lipo -archs dist/PortKilla.app/Contents/MacOS/PortKilla)"
          echo "archs: $ARCHS"
          case "$ARCHS" in *x86_64*arm64*|*arm64*x86_64*) ;; *) echo "not universal" >&2; exit 1;; esac
          CLI=dist/PortKilla.app/Contents/Helpers/portkilla
          test -x "$CLI" || { echo "standalone CLI missing from the bundle" >&2; exit 1; }
          CLI_ARCHS="$(lipo -archs "$CLI")"
          case "$CLI_ARCHS" in *x86_64*arm64*|*arm64*x86_64*) ;; *) echo "CLI not universal: $CLI_ARCHS" >&2; exit 1;; esac
          if otool -L "$CLI" | grep -q AppKit; then echo "the standalone CLI links AppKit" >&2; exit 1; fi
          codesign --verify --strict --verbose=2 dist/PortKilla.app
          PLIST_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/PortKilla.app/Contents/Info.plist)"
          test "$PLIST_VERSION" = "$VERSION" || { echo "Info.plist says $PLIST_VERSION, tag says $VERSION" >&2; exit 1; }
          (cd dist && shasum -a 256 PortKilla.app.zip "PortKilla-$VERSION.dmg" | tee SHA256SUMS)

      - name: Pre-release tags stay out of "latest"
        id: kind
        run: |
          case "$GITHUB_REF_NAME" in *-rc*|*-beta*|*-alpha*) echo "prerelease=true" >> "$GITHUB_OUTPUT";; *) echo "prerelease=false" >> "$GITHUB_OUTPUT";; esac

      - name: Build release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"      # v1.6.0 -> 1.6.0
          bash PortKilla/scripts/release-notes.sh "$VERSION" > release-notes.md
          echo "----- release notes preview -----"
          cat release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            PortKilla/dist/*.zip
            PortKilla/dist/*.dmg
            PortKilla/dist/SHA256SUMS
          draft: false
          prerelease: ${{ steps.kind.outputs.prerelease }}
          body_path: release-notes.md
          # Appends the auto-generated "Full Changelog" / contributors list
          # below our authored notes.
          generate_release_notes: true

  # Pins the tap's cask to this release with its checksum, so `brew upgrade`
  # sees new versions and Homebrew verifies the download. Runs only when a
  # HOMEBREW_TAP_TOKEN secret (a fine-grained PAT with contents: write on
  # mukes555/homebrew-tap) exists; otherwise the tap keeps `version :latest`.
  update-tap:
    needs: build-and-release
    runs-on: ubuntu-latest
    env:
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - name: Checkout PortKilla (for the cask template)
        if: env.HAS_TAP_TOKEN == 'true'
        uses: actions/checkout@v7

      - name: Checkout the tap
        if: env.HAS_TAP_TOKEN == 'true'
        uses: actions/checkout@v7
        with:
          repository: mukes555/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Render and push the pinned cask
        if: env.HAS_TAP_TOKEN == 'true'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF_NAME" in *-rc*|*-beta*|*-alpha*) echo "pre-release: tap not updated"; exit 0;; esac
          SHA="$(curl -sSL "https://github.com/mukes555/PortKilla/releases/download/v$VERSION/PortKilla.app.zip" | shasum -a 256 | cut -d' ' -f1)"
          sed -e "s/__VERSION__/$VERSION/" -e "s/__SHA256__/$SHA/" packaging/homebrew/portkilla.rb.tmpl > tap/Casks/portkilla.rb
          cd tap
          git config user.name "portkilla-release"
          git config user.email "release@portkilla.invalid"
          git add Casks/portkilla.rb
          git commit -m "portkilla $VERSION" || { echo "no change"; exit 0; }
          git push

      - name: Skipped
        if: env.HAS_TAP_TOKEN != 'true'
        run: echo "HOMEBREW_TAP_TOKEN is not set; the tap keeps its version :latest cask."
