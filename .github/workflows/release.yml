name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: macos-14
    # Only this job publishes; update-tap uses its own token.
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2
        with:
          swift-version: '6.0.2'

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Tag, build.sh, and CHANGELOG must agree on the version
        run: bash PortNanny/scripts/check-version.sh "$GITHUB_REF_NAME"

      - name: Build and Package
        run: |
          cd PortNanny
          chmod +x scripts/build.sh
          ./scripts/build.sh --dmg
          ditto -c -k --sequesterRsrc --keepParent dist/PortNanny.app dist/PortNanny.app.zip
          ls -la dist

      - name: Verify what is about to ship
        run: |
          cd PortNanny
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHS="$(lipo -archs dist/PortNanny.app/Contents/MacOS/PortNanny)"
          echo "archs: $ARCHS"
          case "$ARCHS" in *x86_64*arm64*|*arm64*x86_64*) ;; *) echo "not universal" >&2; exit 1;; esac
          CLI=dist/PortNanny.app/Contents/Helpers/portnanny
          test -x "$CLI" || { echo "standalone CLI missing from the bundle" >&2; exit 1; }
          CLI_ARCHS="$(lipo -archs "$CLI")"
          case "$CLI_ARCHS" in *x86_64*arm64*|*arm64*x86_64*) ;; *) echo "CLI not universal: $CLI_ARCHS" >&2; exit 1;; esac
          if otool -L "$CLI" | grep -q AppKit; then echo "the standalone CLI links AppKit" >&2; exit 1; fi
          codesign --verify --strict --verbose=2 dist/PortNanny.app
          PLIST_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/PortNanny.app/Contents/Info.plist)"
          test "$PLIST_VERSION" = "$VERSION" || { echo "Info.plist says $PLIST_VERSION, tag says $VERSION" >&2; exit 1; }
          (cd dist && shasum -a 256 PortNanny.app.zip "PortNanny-$VERSION.dmg" | tee SHA256SUMS)

      - name: Keep the checksums for the tap job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: checksums
          path: PortNanny/dist/SHA256SUMS

      - name: Pre-release tags stay out of "latest"
        id: kind
        run: |
          case "$GITHUB_REF_NAME" in *-rc*|*-beta*|*-alpha*) echo "prerelease=true" >> "$GITHUB_OUTPUT";; *) echo "prerelease=false" >> "$GITHUB_OUTPUT";; esac

      - name: Build release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"      # v1.6.0 -> 1.6.0
          bash PortNanny/scripts/release-notes.sh "$VERSION" > release-notes.md
          echo "----- release notes preview -----"
          cat release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            PortNanny/dist/*.zip
            PortNanny/dist/*.dmg
            PortNanny/dist/SHA256SUMS
          draft: false
          prerelease: ${{ steps.kind.outputs.prerelease }}
          body_path: release-notes.md
          # Appends the auto-generated "Full Changelog" / contributors list
          # below our authored notes.
          generate_release_notes: true

  # Pins the tap's cask to this release with its checksum, so `brew upgrade`
  # sees new versions and Homebrew verifies the download. Runs only when a
  # HOMEBREW_TAP_TOKEN secret (a fine-grained PAT with contents: write on
  # mukes555/homebrew-tap) exists; otherwise the tap keeps `version :latest`.
  update-tap:
    needs: build-and-release
    runs-on: ubuntu-latest
    env:
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - name: Checkout PortNanny (for the cask template)
        if: env.HAS_TAP_TOKEN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Checkout the tap
        if: env.HAS_TAP_TOKEN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: mukes555/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Fetch the checksums the build wrote
        if: env.HAS_TAP_TOKEN == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: checksums
          path: checksums

      - name: Render and push the pinned cask
        if: env.HAS_TAP_TOKEN == 'true'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF_NAME" in *-rc*|*-beta*|*-alpha*) echo "pre-release: tap not updated"; exit 0;; esac
          # The checksum of what was built and signed, not of a re-download:
          # a 404 body hashes cleanly and would be pinned as the real thing.
          SHA="$(awk '/PortNanny\.app\.zip$/ {print $1}' checksums/SHA256SUMS)"
          [ -n "$SHA" ] || { echo "no zip checksum in SHA256SUMS" >&2; exit 1; }
          sed -e "s/__VERSION__/$VERSION/" -e "s/__SHA256__/$SHA/" packaging/homebrew/portnanny.rb.tmpl > tap/Casks/portnanny.rb
          cd tap
          git config user.name "portnanny-release"
          git config user.email "release@portnanny.invalid"
          git add Casks/portnanny.rb
          git commit -m "portnanny $VERSION" || { echo "no change"; exit 0; }
          git push

      - name: Skipped
        if: env.HAS_TAP_TOKEN != 'true'
        run: echo "HOMEBREW_TAP_TOKEN is not set; the tap keeps its version :latest cask."
